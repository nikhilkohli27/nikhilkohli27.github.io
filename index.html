<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Nikhil Kohli — personal site, portfolio, and writing." />
  <title>Nikhil Kohli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="splash" class="splash" role="button" tabindex="0" aria-label="Enter Nikhil Kohli's personal website">
    <p class="splash__text">Enter Nikhil Kohli's personal website</p>
    <p class="splash__hint">click to enter</p>
  </div>

  <main id="site" class="site site--hidden" aria-hidden="true">
    <div class="scene" aria-label="Underwater navigation">
      <div class="scene__frames" id="scene-frames" aria-hidden="true">
        <img class="scene__frame scene__frame--active" src="assets/frames/underwater-frame-1.png" alt="" width="1920" height="1080" />
        <img class="scene__frame" src="assets/frames/underwater-frame-2.png" alt="" width="1920" height="1080" />
        <img class="scene__frame" src="assets/frames/underwater-frame-3.png" alt="" width="1920" height="1080" />
      </div>

      <div class="bubbles" aria-hidden="true">
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
      </div>

      <nav class="shells" aria-label="Site sections">
        <button type="button" class="shell" data-panel="about">About</button>
        <button type="button" class="shell" data-panel="portfolio">Portfolio</button>
        <button type="button" class="shell" data-panel="writing">Writing</button>
        <button type="button" class="shell" data-panel="contact">Contact</button>
        <button type="button" class="shell" data-panel="resume">Resume</button>
      </nav>
    </div>

    <aside class="panel" id="panel" hidden>
      <button type="button" class="panel__close" id="panel-close" aria-label="Close section">&times;</button>
      <div class="panel__content" id="panel-content"></div>
    </aside>

    <div class="audio-ui">
      <button type="button" id="mute-toggle" class="audio-ui__btn" aria-pressed="false" aria-label="Mute music">♪</button>
    </div>
  </main>

  <audio id="ambient-audio" loop preload="auto">
    <source src="assets/audio/weird-fishes.mp3" type="audio/mpeg" />
  </audio>

  <script src="js/main.js"></script>
</body>
</html>
